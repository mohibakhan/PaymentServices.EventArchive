# =============================================================================
# PaymentServices.EventArchive — Release Pipeline
# Deploys function app code + pushes config to Azure App Configuration
#
# Triggers:
#   develop branch build → auto deploy to DEV (no approval)
#   master branch build  → QA (manual approval) → PROD (manual approval)
#
# Connection strings are NOT managed by this pipeline. Add these two
# application settings to each Function App by hand; deployments leave them
# untouched:
#   SERVICE_BUS_CONNSTRING   Service Bus namespace of the topic to archive
#   STORAGE_CONNSTRING       storage account that holds the archive
#
# The deploy step sets only the trigger's topic and subscription (the Service
# Bus trigger is bound by the Functions host, which cannot read App
# Configuration):
#   SERVICE_BUS_TOPIC_NAME          the topic to archive
#   SERVICE_BUS_SUBSCRIPTION_NAME   the unfiltered subscription on that topic
# =============================================================================
name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

resources:
  pipelines:
    - pipeline: build
      source: PaymentServices.EventArchive
      trigger:
        branches:
          include:
            - develop
            - master

variables:
  - name: FunctionAppName
    value: PaymentServices.EventArchive
  - name: ArtifactName
    value: PaymentServices.EventArchive
  - name: ServiceBusTopicName
    value: paymentservicestopic
  - name: ServiceBusSubscriptionName
    value: eventarchive

stages:

  # ---------------------------------------------------------------------------
  # DEV — auto deploys when develop branch build succeeds
  # ---------------------------------------------------------------------------
  - stage: ReleaseDEV
    displayName: 'Release to DEV'
    condition: eq(variables['resources.pipeline.build.sourceBranch'], 'refs/heads/develop')
    jobs:
      - job: DeployEventArchiveDEV
        displayName: 'Deploy EventArchive to DEV'
        pool:
          name: Azure Pipelines
        steps:

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: specific
              project: '$(System.TeamProjectId)'
              definition: '$(resources.pipeline.build.pipelineID)'
              buildVersionToDownload: latest
              artifactName: '$(ArtifactName)'
              targetPath: '$(Pipeline.Workspace)/$(ArtifactName)'

          - task: ExtractFiles@1
            displayName: 'Extract Artifact Zip'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              destinationFolder: '$(System.DefaultWorkingDirectory)/unzip'
              cleanDestinationFolder: true

          - task: AzureAppConfiguration.azure-app-configuration-task-push.custom-build-release-task.AzureAppConfigurationPush@6
            displayName: 'Push Config to App Configuration - DEV'
            inputs:
              azureSubscription: 'Dev-Evolve-SvcCon'
              AppConfigurationEndpoint: 'https://appcs-pmtsvc-dev-centralus.azconfig.io'
              ConfigurationFile: '$(System.DefaultWorkingDirectory)/unzip/deploy_parameters/DEV/dev_ea_env.parameters.json'
              Separator: ':'


          - task: AzureFunctionApp@2
            displayName: 'Deploy EventArchive Function App - DEV'
            inputs:
              connectedServiceNameARM: 'Dev-Evolve-SvcCon'
              appType: functionApp
              appName: 'fa-pmtsvc-eventarchive-dev-centralus'
              package: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              deploymentMethod: zipDeploy
              appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT DEV -SERVICE_BUS_TOPIC_NAME "$(ServiceBusTopicName)" -SERVICE_BUS_SUBSCRIPTION_NAME "$(ServiceBusSubscriptionName)"'

  # ---------------------------------------------------------------------------
  # QA — manual approval then deploy, triggered by master branch build
  # ---------------------------------------------------------------------------
  - stage: ReleaseQA
    displayName: 'Release to QA'
    dependsOn: []
    condition: eq(variables['resources.pipeline.build.sourceBranch'], 'refs/heads/master')
    jobs:

      - job: ApproveQA
        displayName: 'Approve QA Deployment'
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: 'Waiting for QA approval'
            inputs:
              notifyUsers: |
                mkhan.dev@getevolved.com
                perry.dumlao@getevolved.com
              instructions: 'Please review and approve the EventArchive deployment to QA.'
              onTimeout: reject
              timeout: 1440

      - job: DeployEventArchiveQA
        displayName: 'Deploy EventArchive to QA'
        dependsOn: ApproveQA
        condition: succeeded()
        pool:
          name: Azure Pipelines
        steps:

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: specific
              project: '$(System.TeamProjectId)'
              definition: '$(resources.pipeline.build.pipelineID)'
              buildVersionToDownload: latest
              artifactName: '$(ArtifactName)'
              targetPath: '$(Pipeline.Workspace)/$(ArtifactName)'

          - task: ExtractFiles@1
            displayName: 'Extract Artifact Zip'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              destinationFolder: '$(System.DefaultWorkingDirectory)/unzip'
              cleanDestinationFolder: true

          - task: AzureAppConfiguration.azure-app-configuration-task-push.custom-build-release-task.AzureAppConfigurationPush@6
            displayName: 'Push Config to App Configuration - QA'
            inputs:
              azureSubscription: 'QA-Evolve-SvcCon'
              AppConfigurationEndpoint: 'https://appcs-pmtsvc-qa-centralus.azconfig.io'
              ConfigurationFile: '$(System.DefaultWorkingDirectory)/unzip/deploy_parameters/QA/qa_ea_env.parameters.json'
              Separator: ':'


          - task: AzureFunctionApp@2
            displayName: 'Deploy EventArchive Function App - QA'
            inputs:
              connectedServiceNameARM: 'QA-Evolve-SvcCon'
              appType: functionApp
              appName: 'fa-pmtsvc-eventarchive-qa-centralus'
              package: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              deploymentMethod: zipDeploy
              appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT QA -SERVICE_BUS_TOPIC_NAME "$(ServiceBusTopicName)" -SERVICE_BUS_SUBSCRIPTION_NAME "$(ServiceBusSubscriptionName)"'

  # ---------------------------------------------------------------------------
  # PROD — manual approval then deploy, runs after QA succeeds
  #
  # NOTE: the PROD names below follow the RTPSend convention (a per-service
  # App Configuration store, eastus). CONFIRM both exist before the first run:
  #   - App Config:   appcs-pmtsvc-eventarchive-prod-eastus
  #   - Function App: fa-pmtsvc-eventarchive-prod-eastus
  # ---------------------------------------------------------------------------
  - stage: ReleasePROD
    displayName: 'Release to PROD'
    dependsOn: ReleaseQA
    condition: and(succeeded(), eq(variables['resources.pipeline.build.sourceBranch'], 'refs/heads/master'))
    jobs:

      - job: ApprovePROD
        displayName: 'Approve PROD Deployment'
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: 'Waiting for PROD approval'
            inputs:
              notifyUsers: |
                mkhan.dev@getevolved.com
                perry.dumlao@getevolved.com
              instructions: 'Please review and approve the EventArchive deployment to PROD.'
              onTimeout: reject
              timeout: 1440

      - job: DeployEventArchivePROD
        displayName: 'Deploy EventArchive to PROD'
        dependsOn: ApprovePROD
        condition: succeeded()
        pool:
          name: Azure Pipelines
        steps:

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: specific
              project: '$(System.TeamProjectId)'
              definition: '$(resources.pipeline.build.pipelineID)'
              buildVersionToDownload: latest
              artifactName: '$(ArtifactName)'
              targetPath: '$(Pipeline.Workspace)/$(ArtifactName)'

          - task: ExtractFiles@1
            displayName: 'Extract Artifact Zip'
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              destinationFolder: '$(System.DefaultWorkingDirectory)/unzip'
              cleanDestinationFolder: true

          - task: AzureAppConfiguration.azure-app-configuration-task-push.custom-build-release-task.AzureAppConfigurationPush@6
            displayName: 'Push Config to App Configuration - PROD'
            inputs:
              azureSubscription: 'rg-pmtsvc-prod-SvcCon-WI'
              AppConfigurationEndpoint: 'https://appcs-pmtsvc-eventarchive-prod-eastus.azconfig.io'
              ConfigurationFile: '$(System.DefaultWorkingDirectory)/unzip/deploy_parameters/PROD/prod_ea_env.parameters.json'
              Separator: ':'


          - task: AzureFunctionApp@2
            displayName: 'Deploy EventArchive Function App - PROD'
            inputs:
              connectedServiceNameARM: 'rg-pmtsvc-prod-SvcCon-WI'
              appType: functionApp
              appName: 'fa-pmtsvc-eventarchive-prod-eastus'
              package: '$(Pipeline.Workspace)/$(ArtifactName)/$(FunctionAppName).zip'
              deploymentMethod: zipDeploy
              appSettings: '-AZURE_FUNCTIONS_ENVIRONMENT PROD -SERVICE_BUS_TOPIC_NAME "$(ServiceBusTopicName)" -SERVICE_BUS_SUBSCRIPTION_NAME "$(ServiceBusSubscriptionName)"'
